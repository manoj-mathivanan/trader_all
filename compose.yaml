services:
  trader:
    build: .
    restart: unless-stopped
    network_mode: host
    env_file:
      - path: /srv/trader/private/investor-openai.env
        required: false
    environment:
      TRADER_ENV: production
      TRADER_STORAGE: ${TRADER_STORAGE:-postgres}
      TRADER_DB_DSN_FILE: /state/private/database-shared.dsn
      TRADER_DB_NAMESPACE: local
      TRADER_KEY_FILE: /state/private/database-shared-token.key
      TRADER_PUBLIC_ORIGIN: https://trader.manojmathivanan.com
      TRADER_DATA_DIR: /state/data
      TRADER_PRIVATE_DIR: /state/private
    volumes:
      - /srv/trader/data:/state/data
      - /srv/trader/private:/state/private
    stop_grace_period: 60s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
