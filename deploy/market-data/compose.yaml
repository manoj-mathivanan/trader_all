name: market-data
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    mem_limit: 320m
    memswap_limit: 448m
    cpus: 0.65
    shm_size: 80m
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: market_data
      POSTGRES_USER: market_admin
      POSTGRES_PASSWORD_FILE: /run/secrets/admin_password
      POSTGRES_INITDB_ARGS: --data-checksums
    secrets:
      - admin_password
    volumes:
      - /srv/market-data/postgres:/var/lib/postgresql/data
    command:
      - postgres
      - -c
      - shared_buffers=64MB
      - -c
      - effective_cache_size=192MB
      - -c
      - work_mem=2MB
      - -c
      - maintenance_work_mem=32MB
      - -c
      - autovacuum_work_mem=16MB
      - -c
      - autovacuum_max_workers=1
      - -c
      - max_connections=12
      - -c
      - max_parallel_workers_per_gather=0
      - -c
      - max_parallel_maintenance_workers=0
      - -c
      - max_wal_size=256MB
      - -c
      - min_wal_size=64MB
      - -c
      - password_encryption=scram-sha-256
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U market_admin -d market_data"]
      interval: 10s
      timeout: 5s
      retries: 6
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: '2'
secrets:
  admin_password:
    file: /srv/market-data/private/admin_password
